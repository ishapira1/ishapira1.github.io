# Site Settings
locale                   : "en-US"
title                    : "Itai Shapira"
title_separator          : "–"
name                     : &name "Itai Shapira"
description              : &description "PhD researcher at Harvard working on pluralistic AI alignment, algorithmic social choice and optimization. Publications, code, and projects."
url                      : https://www.itai-shapira.com # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "ishapira1/ishapira1.github.io"
breadcrumbs              : true # true, false (default)
words_per_minute         : 160
future                   : false
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

