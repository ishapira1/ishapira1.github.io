<!-- start custom head snippets -->
<!-- Favicons -->
<link rel="icon" href="{{ '/favicon.ico?v=2' | relative_url }}" sizes="any">
<link rel="icon" type="image/svg+xml" href="{{ '/favicon_io/favicon.svg?v=2' | relative_url }}">

<link rel="apple-touch-icon" sizes="180x180" href="{{ '/favicon_io/apple-touch-icon.png?v=2' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon_io/favicon-32x32.png?v=2' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon_io/favicon-16x16.png?v=2' | relative_url }}">

<link rel="manifest" href="{{ '/favicon_io/site.webmanifest?v=2' | relative_url }}">
<meta name="theme-color" content="#f5f7fb" id="theme-color-meta">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<script>
  (function() {
    var storageKey = "theme-preference";
    var lightThemeColor = "#f5f7fb";
    var darkThemeColor = "#272935";
    var root = document.documentElement;
    var savedTheme = null;

    try {
      savedTheme = window.localStorage.getItem(storageKey);
    } catch (error) {
      savedTheme = null;
    }

    if (savedTheme === "light" || savedTheme === "dark") {
      root.setAttribute("data-theme", savedTheme);
    } else {
      root.setAttribute("data-theme", "light");
    }

    var effectiveTheme = savedTheme === "dark" ? "dark" : "light";
    var themeColorMeta = document.querySelector('meta[name="theme-color"]');

    if (themeColorMeta) {
      themeColorMeta.setAttribute("content", effectiveTheme === "dark" ? darkThemeColor : lightThemeColor);
    }
  })();
</script>

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>
